# PL Prime commission slab configuration
product: PL_PRIME
slab_basis: disbursed_amount
slabs:
  - min: 0
    max: 500000
    rate_type: percentage
    rate: 0.60
  - min: 500001
    max: 1500000
    rate_type: percentage
    rate: 0.90
  - min: 1500001
    max: null  # unbounded upper
    rate_type: percentage
    rate: 1.20

sequence_rules:
  first_disbursement_multiplier: 1.0
  subsequent_disbursement_multiplier: 0.5

loan_sequence_tiers:
  - sequence_min: 1
    sequence_max: 3
    rate_adjustment: 0.0
  - sequence_min: 4
    sequence_max: 7
    rate_adjustment: 0.05
  - sequence_min: 8
    sequence_max: null
    rate_adjustment: 0.10
