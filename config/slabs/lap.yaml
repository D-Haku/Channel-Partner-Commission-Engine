# Loan Against Property (LAP) commission slab configuration
product: LAP
slab_basis: disbursed_amount
slabs:
  - min: 0
    max: 1500000
    rate_type: percentage
    rate: 0.40
  - min: 1500001
    max: 4000000
    rate_type: percentage
    rate: 0.55
  - min: 4000001
    max: null  # unbounded upper
    rate_type: percentage
    rate: 0.70

sequence_rules:
  first_disbursement_multiplier: 1.0
  subsequent_disbursement_multiplier: 0.5

loan_sequence_tiers:
  - sequence_min: 1
    sequence_max: 5
    rate_adjustment: 0.0
  - sequence_min: 6
    sequence_max: null
    rate_adjustment: -0.10
